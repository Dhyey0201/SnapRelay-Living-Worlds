services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: snaprelay
      POSTGRES_PASSWORD: snaprelay
      POSTGRES_DB: snaprelay
    ports: ["5434:5432"]
    volumes: ["snaprelay-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snaprelay -d snaprelay"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  snaprelay-db:
